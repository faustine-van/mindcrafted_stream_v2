<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="url(#ring-grad)" />
  <!-- Inner cutout ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="0" />
  <!-- Play triangle — optically centered slightly right -->
